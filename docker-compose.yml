version: '3.3'

services:
  boca-scraper:
    build: ./boca-scraper
    ports:
      - "3001:3001"
    volumes:
      - ./boca-scraper:/app
    environment:
      - BOCA_URL=https://redprogramacioncompetitiva.com/contests/2026/06
      - BOCA_USER=silux
      - BOCA_PASS=ovallos.
      - CACHE_TTL=60
      - BOCA_DB_HOST=${BOCA_DB_HOST:-}
      - BOCA_DB_PORT=${BOCA_DB_PORT:-}
      - BOCA_DB_NAME=${BOCA_DB_NAME:-}
      - BOCA_DB_USER=${BOCA_DB_USER:-}
      - BOCA_DB_PASS=${BOCA_DB_PASS:-}
      - BOCA_CONTEST_NUMBER=${BOCA_CONTEST_NUMBER:-}
    restart: unless-stopped


  generarglobos:
    build: ./generarglobos
    ports:
      - "5000:5000"
    volumes:
      - ./generarglobos:/app
      - globos-data:/app/globosgenerados
    environment:
      - BD_SERVICE_URL=http://boca-scraper:3001
      - BOCA_DB_HOST=${BOCA_DB_HOST:-}
      - BOCA_DB_PORT=${BOCA_DB_PORT:-}
      - BOCA_DB_NAME=${BOCA_DB_NAME:-}
      - BOCA_DB_USER=${BOCA_DB_USER:-}
      - BOCA_DB_PASS=${BOCA_DB_PASS:-}
      - BOCA_CONTEST_NUMBER=${BOCA_CONTEST_NUMBER:-}
    depends_on:
      - boca-scraper
    restart: unless-stopped

  generartabla:
    build: ./generartabla
    ports:
      - "5002:5002"
    volumes:
      - ./generartabla:/app
      - globos-data:/app/globosgenerados
    environment:
      - BD_SERVICE_URL=http://boca-scraper:3001
      - GLOBOS_SERVICE_URL=http://generarglobos:5000
    depends_on:
      - boca-scraper
      - generarglobos
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8001:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - boca-scraper
      - generarglobos
      - generartabla
      - ms4-publisher
    restart: unless-stopped

  ms4-postgres:
    image: postgres:10.23-bullseye
    environment:
      - POSTGRES_DB=ms4_publisher
      - POSTGRES_USER=rpc_user
      - POSTGRES_PASSWORD=rpc_pass
    volumes:
      - ms4-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  ms4-publisher:
    build: ./ms4-publisher
    ports:
      - "8003:8000"
    volumes:
      - ./ms4-publisher:/app
    environment:
      - POSTGRES_DB=ms4_publisher
      - POSTGRES_USER=rpc_user
      - POSTGRES_PASSWORD=rpc_pass
      - POSTGRES_HOST=ms4-postgres
      - POSTGRES_PORT=5432
      - MS1_URL=http://boca-scraper:3001
      - MS2_URL=http://generartabla:5002
      - FORCE_SCRIPT_NAME=/facebook-table/publisher
      - SECRET_KEY=${MS4_SECRET_KEY:-}
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
    command: sh /app/entrypoint.sh

    depends_on:
      - ms4-postgres
      - boca-scraper
      - generartabla
    restart: unless-stopped


volumes:
  globos-data:
  ms4-pgdata:

networks:
  default:
