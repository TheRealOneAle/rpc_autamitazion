version: '3.8'

services:
  boca-scraper:
    build: ./boca-scraper
    ports:
      - "3001:3001"
    environment:
      - BOCA_URL=https://redprogramacioncompetitiva.com/contests/2026/06
      - BOCA_USER=silux
      - BOCA_PASS=ovallos.
      - CACHE_TTL=60
    restart: unless-stopped

  generarglobos:
    build: ./generarglobos
    ports:
      - "5000:5000"
    volumes:
      - ./generarglobos:/app
      - globos-data:/app/globosgenerados
    environment:
      - BD_SERVICE_URL=http://boca-scraper:3001
    depends_on:
      - boca-scraper
    restart: unless-stopped

  generartabla:
    build: ./generartabla
    ports:
      - "5002:5002"
    volumes:
      - ./generartabla:/app
      - globos-data:/app/globosgenerados
    environment:
      - BD_SERVICE_URL=http://boca-scraper:3001
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=rpc
      - RABBIT_PASS=rpc1234
      - COACH_SERVICE_URL=http://coach-service:5003
    depends_on:
      - boca-scraper
      - rabbitmq
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway:/app
    environment:
      - GLOBOS_SERVICE_URL=http://generarglobos:5000
      - TABLA_SERVICE_URL=http://generartabla:5002
      - COACH_SERVICE_URL=http://coach-service:5003
    depends_on:
      - generarglobos
      - generartabla
      - coach-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - ms4-publisher
    restart: unless-stopped

  generartabla-frontend:
    build: ./generartabla/frontend
    ports:
      - "8081:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  coach-frontend:
    build: ./coach-service/frontend
    ports:
      - "8082:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=rpc
      - RABBITMQ_DEFAULT_PASS=rpc1234
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coach-postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=coachdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    volumes:
      - coach-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  coach-service:
    build: ./coach-service
    ports:
      - "5003:5003"
    environment:
      - COACH_DB_URL=postgresql://postgres:1234@coach-postgres:5432/coachdb
      - BD_SERVICE_URL=http://boca-scraper:3001
    depends_on:
      - coach-postgres
      - boca-scraper
    restart: unless-stopped

  notificacion-ranking-service:
    build: ./notificacion-ranking-service
    environment:
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=rpc
      - RABBIT_PASS=rpc1234
      - COACH_SERVICE_URL=http://coach-service:5003
      - TABLA_SERVICE_URL=http://generartabla:5002
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_ADDR=${FROM_ADDR:-}
    depends_on:
      - rabbitmq
      - coach-service
      - generartabla
    restart: unless-stopped

  ms4-postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=ms4_publisher
      - POSTGRES_USER=rpc_user
      - POSTGRES_PASSWORD=rpc_pass
    volumes:
      - ms4-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  ms4-publisher:
    build: ./ms4-publisher
    ports:
      - "8003:8000"
    volumes:
      - ./ms4-publisher:/app
    environment:
      - POSTGRES_DB=ms4_publisher
      - POSTGRES_USER=rpc_user
      - POSTGRES_PASSWORD=rpc_pass
      - POSTGRES_HOST=ms4-postgres
      - POSTGRES_PORT=5432
      - MS1_URL=http://boca-scraper:3001
      - MS2_URL=http://generartabla:5002
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=rpc
      - RABBIT_PASS=rpc1234
      - SECRET_KEY=${MS4_SECRET_KEY:-ms4-dev-secret-key}
      - DEBUG=True
      - ALLOWED_HOSTS=*
    command: sh /app/entrypoint.sh
    depends_on:
      - ms4-postgres
      - rabbitmq
      - boca-scraper
      - generartabla
    restart: unless-stopped

volumes:
  coach-pgdata:
  globos-data:
  ms4-pgdata:

networks:
  default:
