<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPC Social Stream</title>
  <style>
    :root {
      --bg:            #f5f3ff;
      --card-bg:       #ffffff;
      --text:          #1c1a2e;
      --text-sub:      #6b7280;
      --text-hint:     #9ca3af;
      --border:        #e5e7eb;
      --input-border:  #d1d5db;
      --primary:       #7c3aed;
      --primary-hover: #6d28d9;
      --primary-dis:   #c4b5fd;
      --green:         #16a34a;
      --red:           #dc2626;
      --fb-border:     #ddd;
      --fb-reaction:   #65676b;
      --shadow-card:   0 1px 4px rgba(0,0,0,0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #0d0b1a;
        --card-bg:       #181629;
        --text:          #ede9fe;
        --text-sub:      #a29abf;
        --text-hint:     #6b6585;
        --border:        #2e2a45;
        --input-border:  #3d3760;
        --primary:       #a78bfa;
        --primary-hover: #8b5cf6;
        --primary-dis:   #3d2d7a;
        --green:         #4ade80;
        --red:           #f87171;
        --fb-border:     #2e2a45;
        --fb-reaction:   #a29abf;
        --shadow-card:   0 1px 6px rgba(0,0,0,0.4);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
      transition: background .2s, color .2s;
    }

    /* TOPBAR */
    .topbar {
      max-width: 900px;
      margin: 0 auto 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: var(--text-sub); }

    .config-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s;
      flex-shrink: 0;
    }
    .config-btn:hover { background: var(--border); }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

    /* CARD */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      padding: 20px;
    }

    .card h2 {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 16px;
    }

    /* STATUS */
    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--border); }
    .dot.on  { background: var(--green); }
    .dot.off { background: var(--red); }
    .status-label { font-size: 0.9rem; }
    .next-run { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }

    /* PUBLISH BUTTON */
    #btn-publish {
      width: 100%; margin-top: 16px; padding: 12px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    #btn-publish:hover:not(:disabled) { background: var(--primary-hover); }
    #btn-publish:disabled { background: var(--primary-dis); cursor: not-allowed; }
    #publish-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; min-height: 20px; color: var(--green); }
    #publish-msg.err { color: var(--red); }

    /* FACEBOOK PREVIEW */
    .fb-card { border: 1px solid var(--fb-border); border-radius: 10px; overflow: hidden; font-size: 0.9rem; }
    .fb-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .fb-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
    }
    .fb-name { font-weight: 600; font-size: 0.9rem; }
    .fb-meta { font-size: 0.75rem; color: var(--text-sub); }
    .fb-body {
      padding: 0 14px 14px; white-space: pre-wrap; line-height: 1.6;
      color: var(--text); word-break: break-word;
    }
    .fb-img-placeholder {
      background: linear-gradient(135deg, var(--bg) 0%, var(--border) 100%);
      height: 180px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--primary); font-size: 0.85rem; gap: 8px; margin-bottom: 10px;
    }
    .fb-img-placeholder svg { opacity: .5; }
    .fb-reactions {
      border-top: 1px solid var(--fb-border); padding: 8px 14px;
      font-size: 0.8rem; color: var(--fb-reaction); display: flex; gap: 16px;
    }

    .preview-note { font-size: 0.75rem; color: var(--text-sub); margin-top: 12px; text-align: center; }
    .loading { color: var(--text-sub); font-size: 0.85rem; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1>RPC Social Stream</h1>
      <p class="subtitle">Panel de publicaciones en Facebook</p>
    </div>
    <a href="{{ CONTEXT_PATH }}/configuracion/" class="config-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Configuración
    </a>
  </div>

  <div class="grid">

    <!-- COLUMNA IZQUIERDA -->
    <div style="display:flex;flex-direction:column;gap:20px;">
      <div class="card">
        <h2>Estado del servicio</h2>
        <div class="status-row">
          <span class="dot" id="dot-proceso"></span>
          <span class="status-label" id="label-proceso">Cargando...</span>
        </div>
        <p class="next-run" id="next-run"></p>
        <button id="btn-publish" disabled>Publicar ahora</button>
        <p id="publish-msg"></p>
      </div>
    </div>

    <!-- COLUMNA DERECHA: PREVIEW -->
    <div class="card">
      <h2>Vista previa del post</h2>
      <div class="fb-card">
        <div class="fb-header">
          <div class="fb-avatar">R</div>
          <div>
            <div class="fb-name" id="fb-page-name">RPC Competencia</div>
            <div class="fb-meta">Ahora · Público</div>
          </div>
        </div>

        <div class="fb-img-placeholder" id="img-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Cargando imagen del ranking...</span>
        </div>
        <img id="ranking-img" src="" alt="Ranking"
             style="display:none;width:100%;border-bottom:1px solid var(--fb-border);"
             onerror="this.style.display='none';document.getElementById('img-placeholder').style.display='flex';"
             onload="this.style.display='block';document.getElementById('img-placeholder').style.display='none';"
        />

        <div class="fb-body" id="fb-body">Cargando vista previa...</div>

        <div class="fb-reactions">
          <span>Me gusta</span>
          <span>Comentar</span>
          <span>Compartir</span>
        </div>
      </div>
      <p class="preview-note" id="preview-note"></p>
    </div>

  </div>

  <script>
    const API = '{{ CONTEXT_PATH }}';

    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' });
    }

    function buildDescription(data, config) {
      const competitionName  = config.competition_name  || 'Competencia RPC 2026';
      const totalSubmissions = data.total_submissions   ?? '?';
      const teamsWithSolved  = data.teams_with_solved   ?? '?';
      const totalTeams       = data.total_teams         ?? '?';
      const activatedBy      = config.activated_by      || '';

      let footer = '(Automatizado por rpc social stream';
      if (activatedBy) footer += `, gracias ${activatedBy} por activarme :)`;
      footer += ')';

      const nowCol = new Date(Date.now() - 5 * 3600 * 1000);
      const finished = nowCol.getUTCHours() > 18 || (nowCol.getUTCHours() === 18 && nowCol.getUTCMinutes() >= 5);
      const intro = finished
        ? `Asi quedo la parte alta del tablero FINAL de la ${competitionName}.`
        : `Asi va el tablero hasta ahora de la ${competitionName}.`;

      return (
        `${intro} ` +
        `Se realizaron en total ${totalSubmissions} envios, donde ${teamsWithSolved} equipos ` +
        `(de ${totalTeams} en competencia) ` +
        `#TodosSomosRPC #CreciendoTodosJuntos\n\n${footer}`
      );
    }

    async function loadStatus() {
      try {
        const r = await fetch(`${API}/api/status/`);
        const d = await r.json();
        document.getElementById('dot-proceso').className    = 'dot ' + (d.proceso_activo ? 'on' : 'off');
        document.getElementById('label-proceso').textContent  = d.contest_ended
          ? 'Contest finalizado (18:05)'
          : d.proceso_activo ? 'Publicaciones activas' : 'Publicaciones inactivas';
        document.getElementById('next-run').textContent = d.contest_ended
          ? 'No habrá más publicaciones automáticas hoy'
          : d.next_run ? `Próxima publicación automática: ${fmt(d.next_run)}` : '';
        document.getElementById('btn-publish').disabled = d.contest_ended;
      } catch(e) {
        document.getElementById('label-proceso').textContent = 'Sin conexión con el servicio';
      }
    }

    async function loadPreview() {
      const configMap = {};
      try {
        const r = await fetch(`${API}/api/config/`);
        const cfgs = await r.json();
        cfgs.forEach(c => { configMap[c.key] = c.value; });
        document.getElementById('fb-page-name').textContent = configMap.competition_name || 'RPC Competencia';
      } catch(_) {}

      const note = document.getElementById('preview-note');
      try {
        const r = await fetch(`${API}/api/competition-stats/`);
        const stats = await r.json();
        if (stats.error) throw new Error(stats.error);
        note.textContent = 'Vista previa con datos actuales de la competencia.';
        document.getElementById('fb-body').textContent = buildDescription(stats, configMap);
      } catch(e) {
        note.textContent = 'No se pudieron obtener datos. Mostrando ejemplo.';
        document.getElementById('fb-body').textContent = buildDescription(
          { total_teams: 173, total_submissions: 1335, teams_with_solved: 153 }, configMap
        );
      }
    }

    document.getElementById('btn-publish').addEventListener('click', async () => {
      const btn = document.getElementById('btn-publish');
      const msg = document.getElementById('publish-msg');
      btn.disabled = true;
      btn.textContent = 'Publicando...';
      msg.className = '';
      msg.textContent = '';
      try {
        const r = await fetch(`${API}/api/trigger/`, { method: 'POST' });
        const d = await r.json();
        if (r.ok) {
          msg.textContent = d.detail || 'Ciclo iniciado en segundo plano';
          setTimeout(() => { loadStatus(); loadPreview(); }, 3000);
        } else {
          msg.textContent = d.detail || 'Error al publicar';
          msg.className = 'err';
        }
      } catch(e) {
        msg.textContent = 'Error de conexión con el servicio';
        msg.className = 'err';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publicar ahora';
      }
    });

    function loadRankingImage() {
      document.getElementById('ranking-img').src = `${API}/api/preview-image/?t=${Date.now()}`;
    }

    async function init() {
      loadStatus();
      loadPreview();
      loadRankingImage();
    }

    init();
    setInterval(loadStatus, 10000);
    setInterval(loadPreview, 30000);
    setInterval(loadRankingImage, 30000);
  </script>
</body>
</html>
