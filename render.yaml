databases:
  - name: ms4-postgres
    databaseName: ms4_publisher
    user: rpc_user
    plan: free

services:
  # ── boca-scraper (scraping en vivo del scoreboard Boca) ──────────────────────
  - type: web
    name: boca-scraper
    env: docker
    dockerfilePath: ./boca-scraper/Dockerfile
    dockerContext: ./boca-scraper
    envVars:
      - key: BOCA_URL
        sync: false
      - key: BOCA_SALT
        sync: false
      - key: CACHE_TTL
        value: "60"

  # ── generarglobos ────────────────────────────────────────────────────────────
  - type: web
    name: generarglobos
    env: docker
    dockerfilePath: ./generarglobos/Dockerfile
    dockerContext: ./generarglobos

  # ── generartabla ─────────────────────────────────────────────────────────────
  - type: web
    name: generartabla
    env: docker
    dockerfilePath: ./generartabla/Dockerfile
    dockerContext: ./generartabla
    envVars:
      - key: BD_SERVICE_URL
        fromService:
          type: web
          name: boca-scraper
          property: host
      - key: GLOBOS_SERVICE_URL
        fromService:
          type: web
          name: generarglobos
          property: host
      - key: CLOUDAMQP_URL
        sync: false

  # ── ms4-publisher ────────────────────────────────────────────────────────────
  - type: web
    name: ms4-publisher
    env: docker
    dockerfilePath: ./ms4-publisher/Dockerfile
    dockerContext: ./ms4-publisher
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: ms4-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ms4-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: ms4-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: ms4-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ms4-postgres
          property: password
      - key: MS1_URL
        fromService:
          type: web
          name: boca-scraper
          property: host
      - key: MS2_URL
        fromService:
          type: web
          name: generartabla
          property: host
      - key: CLOUDAMQP_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"

  # ── frontend (React/Vite) ─────────────────────────────────────────────────────
  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_MS4_URL
        fromService:
          type: web
          name: ms4-publisher
          property: host
