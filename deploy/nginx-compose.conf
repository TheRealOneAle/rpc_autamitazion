# Gateway Nginx para docker-compose (verificacion local del esquema de contextos).
# Equivalente a deploy/nginx-contextos.conf pero con upstreams por nombre de contenedor.

upstream rpc_scraper    { server boca-scraper:3001; }
upstream rpc_globos     { server generarglobos:5000; }
upstream rpc_tabla      { server generartabla:5002; }
upstream rpc_publisher  { server ms4-publisher:8000; }

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # La interfaz es el dashboard de ms4-publisher (Django); la raiz redirige ahi.
    location = /facebook-table {
        return 301 /facebook-table/publisher/;
    }

    location /facebook-table/ {
        return 301 /facebook-table/publisher/;
    }

    location = /facebook-table/publisher {
        return 301 /facebook-table/publisher/;
    }

    # ms4-publisher: se PRESERVA /facebook-table/publisher (FORCE_SCRIPT_NAME)
    location /facebook-table/publisher/ {
        proxy_pass http://rpc_publisher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # boca-scraper: se strippea el contexto
    location /facebook-table/scraper/ {
        proxy_pass http://rpc_scraper/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # generarglobos: se strippea el contexto
    location /facebook-table/globos/ {
        proxy_pass http://rpc_globos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # generartabla: se strippea el contexto
    location /facebook-table/tabla/ {
        proxy_pass http://rpc_tabla/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
