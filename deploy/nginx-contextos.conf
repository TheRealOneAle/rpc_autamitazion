# Nginx del servidor compartido — microservicios bajo contextos.
# Copiar a /etc/nginx/sites-available/facebook-table.conf (o al conf.d del host),
# ajustar server_name, puertos y los upstream si cambian.
#
# Contextos:
#   /facebook-table/             -> redirige al dashboard de ms4-publisher
#   /facebook-table/scraper/     -> boca-scraper
#   /facebook-table/globos/      -> generarglobos
#   /facebook-table/tabla/       -> generartabla
#   /facebook-table/publisher/   -> ms4-publisher (preserva el contexto: Django usa FORCE_SCRIPT_NAME)
#
# Los microservicios NO asumen la raiz del dominio: viven bajo /facebook-table/<servicio>.

upstream rpc_scraper    { server 127.0.0.1:3001; }
upstream rpc_globos     { server 127.0.0.1:5000; }
upstream rpc_tabla      { server 127.0.0.1:5002; }
upstream rpc_publisher  { server 127.0.0.1:8003; }

server {
    listen 80;
    server_name _;

    # La interfaz es el dashboard de ms4-publisher (Django); la raiz redirige ahi.
    location = /facebook-table {
        return 301 /facebook-table/publisher/;
    }

    location /facebook-table/ {
        return 301 /facebook-table/publisher/;
    }

    location = /facebook-table/publisher {
        return 301 /facebook-table/publisher/;
    }

    # ms4-publisher: se PRESERVA /facebook-table/publisher (FORCE_SCRIPT_NAME)
    location /facebook-table/publisher/ {
        proxy_pass http://rpc_publisher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # boca-scraper: se strippea el contexto
    location /facebook-table/scraper/ {
        proxy_pass http://rpc_scraper/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # generarglobos: se strippea el contexto
    location /facebook-table/globos/ {
        proxy_pass http://rpc_globos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # generartabla: se strippea el contexto
    location /facebook-table/tabla/ {
        proxy_pass http://rpc_tabla/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
